services:
  - type: web
    name: repo-visualizer-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false # This lets us securely paste your active cloud key directly into the Render dashboard!